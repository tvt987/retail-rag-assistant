name: tests
on: [push, pull_request]
jobs:
  test:
    # Default offline pipeline with the standard library only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m app.evaluate

  extras:
    # Qdrant vector store, LangChain pipeline, PDF ingestion and API tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-extras.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m app.evaluate --store qdrant
      - run: python -m app.evaluate --pipeline langchain --store qdrant
